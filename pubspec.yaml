name: faith_runners
description: "FaithRunners — a fast, skill-based arcade race game featuring biblical heroes. No combat, just courage."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.24.0
  flame_audio: ^2.10.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/heroes/
    - assets/images/maps/
    - assets/images/ui/
    - assets/audio/
